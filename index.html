:root{--bg:#0b0c0f;--panel:#16181d;--panel2:#1f2229;--line:#3a3f4a;--tx:#f5f5f2;--dim:#b9bdc6;
--go:#ffd23f;--kai:#5fd4ff;--you:#9df28a;--new:#ff9f6b;--rev:#8fb8ff;--onbg:#3a3210;--sentbg:#10210e;--inbg:#000;--ongo:#111;--glow:#ffd23f55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}html.s1{font-size:21px}html.s2{font-size:25px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
.en{font-family:Andika,"BIZ UDPGothic",sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.4rem .6rem;background:var(--panel);border-bottom:2px solid var(--line)}
.bar .ttl{font-weight:700;margin-right:auto;min-width:0}
.bar .ttl small{color:var(--dim);font-weight:400;display:block;font-size:.75rem;line-height:1.2}
.bar .ttl{line-height:1.25}
.cnt{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.25rem;margin:.4rem 0}.cnt .b{min-width:0;padding:0;font-weight:700}
.hl{color:var(--go)}
.xrow{display:flex;gap:.4rem;align-items:center;min-width:0}.xrow>.say{flex:1;min-width:0}.xrow>.b,.xrow>.lab{flex:none}

ve a copy of the worksheet?","プリントのコピーを1枚もらえますか？",""],[524,"copy","A2","動","写す、コピーする","Copy the words from the board into your notebook.","黒板の単語をノートに写してください。",""],[525,"corn","A1","名","とうもろこし","I love corn soup in winter.","冬はコーンスープが大好きです。",""],[526,"corner","A1","名","角、すみ","Turn left at the next corner.","次の角を左に曲がってください。",""],[527,"correct","A1","形","正しい","Your answer is correct. Good job!","あなたの答えは正しいです。よくできました！",""],[528,"correctly","A2","副","正しく","Did I say your name correctly?","あなたの名前、正しく言えましたか？",""],[529,"cost","A2","名","費用、値段","The cost of the trip is ten thousand yen.","旅行の費用は1万円です。",""],[530,"cost","A2","動","（お金が）かかる","How much does this bag cost?","このかばんはいくらですか？",""],[531,"couch","A1","名","ソファー、長いす","My cat is sleeping on the couch.","うちのねこがソファーで寝ています。",""],[532,"could","A1","助動","〜できた、〜してもらえますか","Could you open the door for me?","ドアを開けてもらえますか？",""],[533,"count","A2","動","数える","Let's count to ten in English.","英語で10まで数えよう。",""],[534,"country","A2","名","国、田舎","Which country do you want to visit?","どの国に行ってみたいですか？",""],[535,"countryside","A2","名","田舎、田園地帯","My grandparents live in the countryside.","祖父母は田舎に住んでいます。",""],[536,"couple","A2","名","（a couple of で）2つ、2、3","I'll be ready in a couple of minutes.","2、3分で準備できるよ。",""],[537,"course","A1","名","講座、コース","I'm taking a cooking course this summer.","この夏、料理の講座を受けています。",""],[538,"court","A2","名","（テニスなどの）コート","Let's meet at the tennis court at three.","3時にテニスコートで会おう。",""],[539,"cousin","A1","名","いとこ","My cousin and I play games online together.","いとこと私はオンラインで一緒にゲームをします。",""],[540,"cover","A1","名","表紙、カバー、ふた","I like the cover of this book.","この本の表紙が好きです。",""],[541,"cover","A2","動","おおう、かぶせる","Cover your mouth when you cough.","せきをするときは口をおおってください。",""],[542,"cow","A1","名","牛、雌牛","We saw lots of cows at the farm.","牧場でたくさんの牛を見ました。",""],[543,"crazy","A2","形","夢中な、とんでもない","My brother is crazy about soccer.","兄はサッカーに夢中です。",""],[544,"cream","A2","形","クリーム色の","I want a cream sweater for winter.","冬用にクリーム色のセーターがほしいです。", b5:{t:"Kai の意見：スマホとインターネット",sc:"オンライン交流の「今週のテーマ」に、Kai がスマホとインターネットについて意見を書く。",s:[
 ["Our topic this week is smartphones and the internet.","今週のテーマは、スマホとインターネットです。"],
 ["I use my smartphone to watch rugby games and to talk with my friends in Japan.","ぼくは、ラグビーの試合を見たり、日本の友だちと話したりするのにスマホを使います。"],
 ["I spend about two hours on my phone every day.","毎日、スマホに2時間くらい使っています。"],
 ["Thanks to the internet, we can watch games from all over the world.","インターネットのおかげで、世界中の試合が見られます。"],
 ["I can also read news about space, such as news about the Japanese space probe Hayabusa2.","日本の探査機「はやぶさ2」のような、宇宙のニュースも読めます。"],
 ["In 2020, it brought back sand from an asteroid called Ryugu.","2020年、はやぶさ2は「リュウグウ」という小惑星の砂を持ち帰りました。"],
 ["However, we should be careful not to use our phones too much.","でも、スマホを使いすぎることには気をつけたほうがいいです。"],
 ["I used to stay up late watching videos, and I always felt tired.","前は夜おそくまで動画を見ていて、いつもつかれていました。"],
 ["Now I try not to use my phone after ten o'clock.","今は、夜10時をすぎたらスマホを使わないようにしています。"],
 ["How do you use your phone?","みなさんは、スマホをどう使っていますか？"]],
 q:[["How long does Kai spend on his phone every day?","Kai は毎日どのくらいスマホを使う？","c",["about two hours","about one hour","more than four hours"],0,2,""],

  ["Why did Kai always feel tired before?","前、Kai はどうしていつもつかれていた？","w",null,0,7,"Because he stayed up late watching videos."],
  ["What does Kai try to do now?","今、Kai は何をするようにしている？","c",["not use his phone after ten o'clock","watch more videos","sleep in the afternoon"],0,8,""]]},

 ["I'm writing this letter by hand.","この手紙は、手書きで書いています。"],

c1:{t:"Kai の意見文：AI と仕事の未来",sc:"オンライン交流の「意見文コーナー」に、Kai が「AI は人の仕事をうばうか」について書く。",s:[
 ["These days, many people say that AI will take our jobs.","最近、AI が人の仕事をうばうと言う人がたくさんいます。"],
 ["As someone who wants to become a chef, I have thought about this question a lot.","シェフになりたい者として、ぼくはこの問いについてよく考えてきました。"],
 ["It is true that AI can already do many simple tasks.","たしかに、AI はすでに多くの単純な作業ができます。"],
 ["For example, an AI app can suggest recipes in a few seconds.","たとえば、AI のアプリは数秒でレシピを提案できます。"],
 ["However, it cannot taste food or see the faces of the people who eat it.","しかし、AI は料理を味わうことも、食べる人の顔を見ることもできません。"],
 ["In my opinion, cooking is not only about recipes but also about caring for people.","ぼくの考えでは、料理はレシピだけでなく、人を思いやることでもあります。"],
 ["Rugby has also taught me that teamwork is something machines cannot easily replace.","ラグビーからも、チームワークは機械が簡単には代われないものだと学びました。"],
 ["Of course, some jobs will change, and some may disappear.","もちろん、変わる仕事もあり、なくなる仕事もあるかもしれません。"],
 ["At the same time, new jobs will be created, just as they were when computers appeared.","同時に、コンピュータが登場したときと同じように、新しい仕事も生まれるでしょう。"],
 ["That is why I think we should learn to use AI as a tool.","だから、AI を道具として使えるようになるべきだと思います。"],
 ["If I had to choose one important skill for the future, I would choose teamwork.","将来に大切な力を1つ選ぶとしたら、ぼくはチームワークを選びます。"],
 ["In conclusion, I believe AI will not replace people if we keep learning and working together.","まとめると、学び続け、力を合わせていけば、AI が人の代わりになってしまうことはないと思います。"],
 ["What's your opinion on this topic?","このテーマについて、みなさんの意見はどうですか？"]],

  ["What can't AI do, according to Kai?","Kai によると、AI にできないことは？","c",["taste food","suggest recipes","do simple tasks"],0,4,""],

c2:{t:"Kai の体験：SNS で学んだこと",sc:"オンライン交流の「今月のテーマ」に、Kai が SNS での体験と考えを書く。",s:[
 ["Social media has changed the way I live.","SNS は、ぼくの暮らし方を変えました。"],
 ["One advantage is that it lets me connect with my friends in Japan every week.","よいところの1つは、毎週、日本の友だちとつながれることです。"],
 ["I have also learned a lot about anime and Japanese food from posts by people in Japan.","日本の人たちの投稿から、アニメや日本の食べ物についても多くを学びました。"],
 ["However, last year I had an experience that taught me an important lesson.","しかし、去年、大切なことを学ぶ体験をしました。"],
 ["I saw a post saying that my favorite rugby player had quit his team.","好きなラグビー選手がチームをやめた、という投稿を見たのです。"],
 ["I was so shocked that I shared it with all my friends right away.","とてもショックだったので、すぐに友だち全員にシェアしました。"],
 ["The next day, I found out that the news was fake.","次の日、そのニュースがうそだったと分かりました。"],
 ["I felt terrible, because I had spread false information without checking it.","確かめずにまちがった情報を広めてしまい、とても悪いことをしたと思いました。"],
 ["What worries me is that fake news spreads much faster than the truth.","心配なのは、うそのニュースが本当の情報よりずっと速く広まることです。"],
 ["Since then, I have always checked the facts before sharing anything.","それからは、何かをシェアする前に、いつも事実を確かめるようにしています。"],
 ["It is important that we think twice before we post.","のせる前に、よく考えることが大切です。"],
 ["If everyone did that, social media would be a better place.","みんながそうすれば、SNS はもっとよい場所になるでしょう。"],
 ["Have you ever had a similar experience?","みなさんは、同じような体験をしたことがありますか？"]],
 q:[["What is one advantage of social media for Kai?","Kai にとって、SNS のよいところの1つは？","c",["He can connect with his friends in Japan.","He can sell his food online.","He can watch rugby for free."],0,1,""],
  ["What did the post say?","その投稿には何と書いてあった？","c",["Kai's favorite rugby player had quit his team.","A new rugby stadium had opened in Kai's town.","Kai's friend had moved to Japan."],0,4,""],
  ["Why did Kai feel terrible?","Kai はどうしてとても悪いことをしたと思った？","w",null,0,7,"Because he had spread false information without checking it."],
  ["What has Kai done since then?","それから、Kai は何をしている？","c",["He has checked the facts before sharing anything.","He has stopped using social media.","He has posted more news every day."],0,9,""]]},
c3:{t:"Kai の意見文：だれもが過ごしやすい町",sc:"オンライン交流の「意見文コーナー」に、Kai が「だれもが過ごしやすい町」について書く。",s:[
 ["My grandfather has used a wheelchair since he hurt his back five years ago.","ぼくの祖父は、5年前に背中をけがしてから、車いすを使っています。"],
 ["Since then, I have noticed many things in my town that I never paid attention to before.","それから、町の中で、前は気にとめていなかったことにたくさん気づくようになりました。"],
 ["For example, some shops have steps at the entrance, so he cannot go inside.","たとえば、入口に段がある店があり、祖父は中に入れません。"],
 ["On the other hand, the buses in my town now have ramps, and the library has added an elevator.","一方で、町のバスには今はスロープがついていて、図書館にはエレベーターができました。"],
 ["These changes have made it possible for him to go out by himself.","こうした変化のおかげで、祖父は1人で出かけられるようになりました。"],
 ["I believe everyone should be able to go where they want.","だれもが、行きたい所へ行けるべきだと思います。"],
 ["Some people say that making a town accessible costs too much money.","町を使いやすくするには、お金がかかりすぎると言う人もいます。"],
 ["That's a fair point, but a ramp helps not only wheelchair users but also people pushing baby strollers and older people.","もっともな意見ですが、スロープは車いすを使う人だけでなく、ベビーカーをおす人やお年寄りの助けにもなります。"],
 ["In other words, it helps everyone, not only some people.","つまり、一部の人だけでなく、みんなの助けになるのです。"],
 ["Besides, anyone may need support someday.","それに、だれでもいつか支えが必要になるかもしれません。"],
 ["To make our society more inclusive, we need to listen to people who need support.","だれもが過ごしやすい社会にするには、支えが必要な人の声を聞く必要があります。"],
 ["Small changes can make a big difference.","小さな変化が、大きなちがいを生みます。"],
 ["What does your town do to be more inclusive?","みなさんの町では、だれもが過ごしやすくなるように、何をしていますか？"]],
 q:[["Why has Kai started to notice things in his town?","Kai はどうして町の中のことに気づくようになった？","c",["because his grandfather began to use a wheelchair","because he started working at a shop","because he moved to a new town"],0,0,""],
  ["What problem do some shops have?","いくつかの店には、どんな問題がある？","c",["They have steps at the entrance.","They are closed on weekends.","They don't sell books."],0,2,""],
  ["Who does a ramp help, according to Kai?","Kai によると、スロープはだれの助けになる？","w",null,0,7,"It helps wheelchair users, people pushing baby strollers and older people."],
  ["What do we need to do to make our society more inclusive?","だれもが過ごしやすい社会にするには、何をする必要がある？","c",["listen to people who need support","build more shops","stop using buses"],0,10,""]]},
c4:{t:"Kai のレポート：ニュージーランドと日本のエネルギー",sc:"Kai が、オンライン交流で「ニュージーランドと日本のエネルギー」について調べたことを発表する。",s:[
 ["Today, I'd like to compare energy in New Zealand and Japan.","今日は、ニュージーランドと日本のエネルギーをくらべたいと思います。"],
 ["Did you know that New Zealand gets most of its electricity from renewable energy?","ニュージーランドは、電気のほとんどを再生可能エネルギーで作っていることを知っていましたか？"],
 ["Much of it comes from hydropower, and some comes from geothermal power.","その多くは水力発電で、地熱発電からも一部を作っています。"],
 ["Geothermal power uses heat from deep under the ground, and New Zealand has many volcanoes.","地熱発電は地下深くの熱を使います。そしてニュージーランドには火山がたくさんあります。"],
 ["When I learned this, I thought of Japan, because Japan also has many volcanoes and hot springs.","これを知ったとき、日本のことを思いうかべました。日本にも火山や温泉がたくさんあるからです。"],
 ["According to what I've read, Japan has one of the largest geothermal resources in the world.","ぼくが読んだものによると、日本は、地熱資源の量が世界でもトップクラスの国の1つです。"],
 ["However, Japan still uses only a small part of it.","しかし、日本はまだそのほんの一部しか使っていません。"],
 ["If I were a leader in Japan, I would invest more in geothermal power.","もしぼくが日本のリーダーなら、地熱発電にもっと投資します。"],
 ["The main reason is that it helps reduce CO2 and can produce electricity day and night.","いちばんの理由は、CO2 を減らすのに役立ち、昼も夜も電気を作れることです。"],
 ["Of course, building new power plants costs a lot of money and takes time.","もちろん、新しい発電所を作るにはお金も時間もかかります。"],
 ["Climate change is a problem that no country can solve alone, but we must act now.","気候変動は、1つの国だけで解決できる問題ではありませんが、今、行動しなければなりません。"],
 ["At home, I turn off the lights and use LED lights to save energy.","家では、電気を消したり LED 電球を使ったりして、エネルギーを節約しています。"],
 ["Every small action counts.","小さな行動の1つ1つが大切です。"]],
 q:[["Where does New Zealand get most of its electricity from?","ニュージーランドは電気のほとんどを何から作っている？","c",["renewable energy","coal","nuclear power"],0,1,""],
  ["Why did Kai think of Japan?","Kai はどうして日本のことを思いうかべた？","c",["because Japan also has many volcanoes and hot springs","because Japan uses a lot of hydropower","because he visited Japan last year"],0,4,""],
  ["What would Kai do if he were a leader in Japan?","もし日本のリーダーなら、Kai は何をする？","w",null,0,7,"He would invest more in geothermal power."],
  ["What does Kai do at home to save energy?","Kai は家で、エネルギーを節約するために何をしている？","c",["He turns off the lights and uses LED lights.","He stops using his phone.","He cooks without electricity."],0,11,""]]},
c5:{t:"Kai の意見文：AI と科学のこれから",sc:"オンライン交流の「意見文コーナー」に、Kai が科学技術と AI について書く。",s:[
 ["I'm interested in science because it helps us understand the world.","科学は世界を理解するのに役立つので、ぼくは科学に興味があります。"],
 ["My favorite topic is space.","いちばん好きな話題は宇宙です。"],
 ["I was amazed when I learned that the Japanese space probe Hayabusa2 brought back sand from an asteroid in 2020.","日本の探査機はやぶさ2が、2020年に小惑星の砂を持ち帰ったと知ったとき、とてもおどろきました。"],
 ["Science and technology are also changing my daily life.","科学技術は、ぼくの毎日の生活も変えています。"],
 ["For instance, AI has made it easier to translate languages.","たとえば、AI のおかげで、ことばの翻訳がしやすくなりました。"],
 ["Thanks to AI translation, I can understand some Japanese posts about anime.","AI の翻訳のおかげで、アニメについての日本語の投稿が少し分かります。"],
 ["Although AI is convenient, it sometimes makes mistakes.","AI は便利ですが、ときどきまちがえます。"],
 ["Once, it translated the name of a dish into something strange, and my Japanese friend laughed a lot.","前に、料理の名前を変なことばに訳してしまい、日本の友だちに大笑いされました。"],
 ["That is why we need to check the information and think for ourselves.","だから、情報を確かめ、自分の頭で考える必要があります。"],
 ["In the future, AI will probably help doctors find diseases and help people with disabilities.","将来、AI はたぶん、医者が病気を見つけるのを助けたり、障害のある人の助けになったりするでしょう。"],
 ["If I could study anything, I would study food science.","何でも学べるとしたら、ぼくは食べ物の科学を学びます。"],
 ["I would like to use science and AI to create healthy and delicious dishes.","科学と AI を使って、体によくておいしい料理を作りたいです。"],
 ["How do you use AI?","みなさんは、AI をどう使っていますか？"]],
 q:[["What is Kai's favorite topic in science?","Kai が科学でいちばん好きな話題は？","c",["space","robots","medicine"],0,1,""],
  ["What did Hayabusa2 bring back in 2020?","はやぶさ2は2020年に何を持ち帰った？","c",["sand from an asteroid","rocks from the moon","ice from Mars"],0,2,""],
  ["Why did Kai's Japanese friend laugh a lot?","Kai の日本の友だちは、どうして大笑いした？","w",null,0,7,"Because AI translated the name of a dish into something strange."],
  ["What would Kai study if he could study anything?","何でも学べるとしたら、Kai は何を学ぶ？","c",["food science","space science","computer science"],0,10,""]]},
c6:{t:"Kai の発表：日本の文化で体験したいこと",sc:"Kai が、オンライン交流で「いつか日本で体験したい文化」を発表する。",s:[
 ["I'd like to talk about some parts of Japanese culture that I want to experience someday.","いつか体験したい日本の文化について話します。"],
 ["First, I want to try real washoku, which is traditional Japanese food.","まず、日本の伝統的な料理である和食を、本場で食べてみたいです。"],
 ["Washoku was added to UNESCO's Intangible Cultural Heritage list in 2013.","和食は、2013年にユネスコの無形文化遺産に登録されました。"],
 ["As a future chef, I'm especially interested in how Japanese cooks use umami.","将来シェフになりたい者として、日本の料理人がうま味をどう使うのかにとくに興味があります。"],
 ["Second, I want to watch sumo, which has a history of more than 1,000 years.","2つ目に、1000年以上の歴史がある相撲を見てみたいです。"],
 ["The ceremonies before each sumo bout remind me of the haka, a traditional Māori dance from New Zealand.","相撲の取組の前の儀式は、ニュージーランドのマオリの伝統的なおどり、ハカを思い出させます。"],
 ["The All Blacks perform a haka before their rugby games, and it shows strength, pride and respect.","オールブラックスはラグビーの試合の前にハカをおどり、それは強さとほこり、敬意を表しています。"],
 ["Both sumo and the haka have deep meanings that go beyond sport.","相撲もハカも、スポーツをこえた深い意味を持っています。"],
 ["Third, I'd like to try origami.","3つ目に、折り紙をやってみたいです。"],
 ["Interestingly, a folding method based on origami was used for a solar panel in space.","おもしろいことに、折り紙をもとにした折り方が、宇宙で使う太陽電池パネルに使われたことがあります。"],
 ["I was surprised that a traditional art is connected to space technology.","伝統的な技が宇宙の技術とつながっていることに、おどろきました。"],
 ["Japanese culture is not only beautiful but also full of ideas.","日本の文化は、美しいだけでなく、アイデアにもあふれています。"],
 ["What Japanese culture would you recommend to me?","ぼくに、どんな日本の文化をすすめてくれますか？"]],
 q:[["When was washoku added to UNESCO's list?","和食がユネスコのリストに登録されたのはいつ？","c",["in 2013","in 2003","in 2023"],0,2,""],
  ["Why is Kai especially interested in umami?","Kai はどうしてとくにうま味に興味がある？","c",["because he wants to be a chef","because he is a scientist","because his mother is Japanese"],0,3,""],
  ["When do the All Blacks perform the haka?","オールブラックスは、いつハカをおどる？","w",null,0,6,"They perform it before their rugby games."],
  ["What surprised Kai about origami?","折り紙について、Kai がおどろいたことは？","c",["It is connected to space technology.","It is only for children.","It was invented in New Zealand."],0,10,""]]}

function radarPng(v,cb){
 try{
  var svg=radar(v,null,{line:"#c9ccd3",tx:"#222222",go:"#d9a400",dim:"#888888"}).replace('<svg class="radar"','<svg xmlns="http://www.w3.org/2000/svg" width="570" height="333"');
  svg=svg.replace(/<svg([^>]*)>/,'<svg$1><rect x="-80" y="2" width="380" height="222" fill="#ffffff"/>');
  var img=new Image();
  img.onload=function(){try{var c=document.createElement("canvas");c.width=570;c.height=333;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,570,333);x.drawImage(img,0,0,570,333);cb(c.toDataURL("image/png"));}catch(e){cb("");}};

/* 記録の集まりから、画面に出すものを作る */
function recSummary(ev,thr){
 var days={},steps={},convs=0,notes=0,own=0,rq=0,ron=0,rcp=0;
 ev.forEach(function(e){var d=e[0],st=e[1],ty=e[2],lv=e[3],a=e[4];
  if(ty==="save"||ty==="qa"||ty==="ondoku"||ty==="copy")days[d]=(days[d]||0)+1;
  if(ty==="qa")rq++;if(ty==="ondoku")ron++;if(ty==="copy")rcp++;
  if(ty==="conv")convs++;if(ty==="note")notes++;if(ty==="save"&&e[5])own++;
  if((ty==="check"||ty==="save")){var s=steps[st]=steps[st]||{n:0,lv:{},a:[]};s.n++;if(lv!=null)s.lv[lv]=1;if(a)s.a.push(a);}});
 var learned=Object.keys(days).filter(function(d){return days[d]>=(thr||1);}).sort();
 var all=[];Object.keys(steps).forEach(function(k){steps[k].a.forEach(function(a){all.push(a);});});
 var avg=function(list){if(!list.length)return null;var t=[0,0,0];list.forEach(function(a){t[0]+=a[0];t[1]+=a[1];t[2]+=a[2];});return t.map(function(x){return Math.round(x/list.length*10)/10;});};
 var keys=Object.keys(steps),rep=keys.length?Math.round(keys.reduce(function(t,k){return t+Math.min(4,steps[k].n);},0)/keys.length*10)/10:0;
 var first=avg(all.slice(0,5)),last=avg(all.slice(-5));
 var good=[];
 if(learned.length)good.push("アプリで学んだ日："+learned.length+"日");
 var f4=all.filter(function(a){return a[1]>=4;}).length;if(f4)good.push("「3つの言い方」の形を使えた文："+f4);
 if(own)good.push("自分の言葉で作った文："+own);
 var vary=keys.filter(function(k){return Object.keys(steps[k].lv).length>=2;}).length;if(vary)good.push("いくつかの言い方を使えた場面："+vary);
 if(convs)good.push("Kai とのやり取りを最後までした回数："+convs);
 if(notes)good.push("ノートに残した文："+notes);
 if(rq)good.push("英文を読んで問いに答えた回数："+rq);if(ron)good.push("英文を最後まで音読した回数："+ron);if(rcp)good.push("英文を最後まで写した回数："+rcp);
 var grew=keys.filter(function(k){var a=steps[k].a;if(a.length<2)return false;var s=function(x){return x[0]+x[1]+x[2];};return s(a[a.length-1])>s(a[0]);}).length;
 if(grew)good.push("練習して前より良くなった場面："+grew);
 return {learned:learned,last:last?[last[0],last[1],last[2],rep]:null,first:first&&all.length>5?[first[0],first[1],first[2],rep]:null,good:good,steps:keys.length};
}
function calHtml(learned){
 var set={};learned.forEach(function(d){set[d]=1;});
 var now=new Date(),out="";
 for(var m=1;m>=0;m--){
  var y=now.getFullYear(),mo=now.getMonth()-m;if(mo<0){mo+=12;y--;}
  var first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),cells="";
  "日月火水木金土".split("").forEach(function(w){cells+='<div class="cw">'+w+'</div>';});
  for(var i=0;i<first.getDay();i++)cells+='<div></div>';
  for(var d=1;d<=dim;d++){var k=y+"-"+("0"+(mo+1)).slice(-2)+"-"+("0"+d).slice(-2);cells+='<div class="cd'+(set[k]?" on":"")+'">'+(set[k]?"★":"")+'<span>'+d+'</span></div>';}
  out+='<div class="cal"><b>'+y+'年'+(mo+1)+'月</b><div class="cg">'+cells+'</div></div>';
 }
 return '<div class="cals">'+out+'</div>';
}

window.addEventListener("resize",function(){if($("cv"))mountHW();});
/* iPad：キーボード（音声入力を含む）が下から出てきたら、入力欄が隠れないように、
   入力欄を画面の上のほうへ自動で上げる。生徒が自分でスクロールしなくてよいように。（v0.13） */
function isField(el){return el&&/^(TEXTAREA|INPUT)$/.test(el.tagName)&&el.type!=="file";}
function showFocus(){
 var el=document.activeElement;if(!isField(el))return;
 var p=el.closest(".pane,.main,.modal .card");if(!p)return;
 var r=el.getBoundingClientRect(),pr=p.getBoundingClientRect(),want=pr.top+Math.min(80,pr.height*0.12);
 if(Math.abs(r.top-want)>8)p.scrollTop+=r.top-want;
}
var kbdT=null;
document.addEventListener("focusin",function(e){if(!isField(e.target))return;clearTimeout(kbdT);document.documentElement.classList.add("kbd");
 [50,350,800].forEach(function(t){setTimeout(showFocus,t);});});
document.addEventListener("focusout",function(e){if(!isField(e.target))return;kbdT=setTimeout(function(){if(!isField(document.activeElement))document.documentElement.classList.remove("kbd");},400);});
window.addEventListener("resize",function(){setTimeout(showFocus,60);});
if(window.visualViewport)window.visualViewport.addEventListener("resize",function(){setTimeout(showFocus,60);});
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}

load();setThemes();render();

 run("boot",null,function(r){

  if(r){S.nick=r.nick;S.cls=r.cls;S.teacher=r.teacher;S.answers=r.answers||{};S.tries=r.tries||{};S.noteUrl=r.noteUrl||"";
   if(r.sel)Object.keys(r.sel).forEach(function(k){S.sel[k]=r.sel[k];});}
  render();
  run("getDict",null,function(t){try{S.dict=JSON.parse(t);render();}catch(e){}});
 });
}
window.__WP={S:S,render:render,READ:READ};
})();
