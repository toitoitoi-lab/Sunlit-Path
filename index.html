:root{--bg:#0b0c0f;--panel:#16181d;--panel2:#1f2229;--line:#3a3f4a;--tx:#f5f5f2;--dim:#b9bdc6;
--go:#ffd23f;--kai:#5fd4ff;--you:#9df28a;--new:#ff9f6b;--rev:#8fb8ff;--onbg:#3a3210;--sentbg:#10210e;--inbg:#000;--ongo:#111;--glow:#ffd23f55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}html.s1{font-size:21px}html.s2{font-size:25px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
.en{font-family:Andika,"BIZ UDPGothic",sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.4rem .6rem;background:var(--panel);border-bottom:2px solid var(--line)}
.bar .ttl{font-weight:700;margin-right:auto;min-width:0}
.bar .ttl small{color:var(--dim);font-weight:400;margin-left:.5rem}
.b{min-height:44px;min-width:44px;padding:.35rem .8rem;border-radius:.6rem;border:2px solid var(--line);background:var(--panel2);text-align:center}
.b:active{transform:scale(.97)}
.b.on{border-color:var(--go);background:var(--onbg)}
.b.go{background:var(--go);color:var(--ongo);border-color:var(--go);font-weight:700}
.b.sm{padding:.2rem .55rem}
.b[disabled]{opacity:.4}
.main{flex:1;min-height:0;overflow:auto;padding:.7rem}

function kb(){

 var sw='<div class="row kbsw"><span class="dim">'+L("kblabel")+'</span><button class="b sm'+(!qw?" on":"")+'" data-a="kbl" data-v="abc">'+L("kbl_abc")+'</button><button class="b sm'+(qw?" on":"")+'" data-a="kbl" data-v="qwerty">'+L("kbl_qw")+'</button></div>';
 var capsB=function(span){return '<button class="w2" data-a="caps" style="grid-column:span '+span+';'+(cp?"border-color:var(--go)":"")+'">'+L("caps")+'</button>';};
 if(qw){
  var ks=[],gap=function(n){return '<span style="grid-column:span '+n+'"></span>';};
  "qwertyuiop".split("").forEach(function(c){ks.push(key(c,2));});
  ks.push(gap(1));"asdfghjkl".split("").forEach(function(c){ks.push(key(c,2));});ks.push(gap(1));
  ks.push(capsB(3));"zxcvbnm".split("").forEach(function(c){ks.push(key(c,2));});ks.push('<button class="w2" data-a="bs" style="grid-column:span 3">← '+L("del")+'</button>');
  ["'",".",",","?","!"].forEach(function(c){ks.push('<button class="en" data-a="key" data-v="'+c+'" style="grid-column:span 2">'+c+'</button>');});
  ks.push('<button class="w2" data-a="key" data-v=" " style="grid-column:span 10">'+L("space")+'</button>');

  return sw+'<div class="kb qw">'+ks.join("")+'</div>';
 }
 var ks="abcdefghijklmnopqrstuvwxyz".split("").map(function(c){return key(c);});

 ks.push('<button class="en" data-a="key" data-v=",">,</button>','<button class="en" data-a="key" data-v="?">?</button>','<button class="en" data-a="key" data-v="!">!</button>');

}

var LW=1400,LH=900;
function drawStrokes(ctx,k){
 ctx.fillStyle="#fff";ctx.fillRect(0,0,LW*k,LH*k);
 ctx.strokeStyle="#cfd8e6";ctx.lineWidth=2*k;
 for(var y=150;y<LH;y+=150){ctx.beginPath();ctx.moveTo(0,y*k);ctx.lineTo(LW*k,y*k);ctx.stroke();}
 ctx.strokeStyle="#000";ctx.lineCap="round";ctx.lineJoin="round";
 S.hw.strokes.forEach(function(s){ctx.lineWidth=s.w*k;ctx.beginPath();
  s.p.forEach(function(pt,i){if(i)ctx.lineTo(pt[0]*k,pt[1]*k);else ctx.moveTo(pt[0]*k,pt[1]*k);});
  if(s.p.length===1)ctx.lineTo(s.p[0][0]*k+0.1,s.p[0][1]*k);ctx.stroke();});
}
function mountHW(){
 var box=$("hwc"),cv=$("cv"),bw=box.clientWidth-8,bh=box.clientHeight-8;
 var k=Math.max(0.05,Math.min(bw/LW,bh/LH)),dpr=window.devicePixelRatio||1;
 cv.style.width=Math.floor(LW*k)+"px";cv.style.height=Math.floor(LH*k)+"px";
 cv.width=Math.floor(LW*k*dpr);cv.height=Math.floor(LH*k*dpr);
 var ctx=cv.getContext("2d"),kk=k*dpr;drawStrokes(ctx,kk);
 var cu=null;
 function pos(e){var r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/k),Math.round((e.clientY-r.top)/k)];}
 cv.onpointerdown=function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}cu={w:S.hw.thick?14:7,p:[pos(e)]};S.hw.strokes.push(cu);drawStrokes(ctx,kk);};
 cv.onpointermove=function(e){if(!cu)return;e.preventDefault();var p=pos(e),q=cu.p[cu.p.length-1];cu.p.push(p);
  ctx.strokeStyle="#000";ctx.lineCap="round";ctx.lineWidth=cu.w*kk;ctx.beginPath();ctx.moveTo(q[0]*kk,q[1]*kk);ctx.lineTo(p[0]*kk,p[1]*kk);ctx.stroke();};
 cv.onpointerup=cv.onpointercancel=function(){cu=null;};
}
function hwImage(){
 if(!S.hw.strokes.length)return "";
 var c=document.createElement("canvas");c.width=LW;c.height=LH;drawStrokes(c.getContext("2d"),1);return c.toDataURL("image/png");
}

 if(lines[c.i][0]==="K"){var tok=c;speak(lines[c.i][1],function(){if(S.conv!==tok)return;c.i++;setTimeout(convNext,300);},"K");}
}
function inpText(){var a=S.inp,ta=$("ta");if(ta&&a)a.text=ta.value;return a?norm(a.text):"";}
function doSave(){
 var st=cur(),a=S.inp,text=inpText(),img="";
 if(a.method==="hand"){img=hwImage();if(!img){toast("まだ書いていません");return;}if(a.read===undefined)text="";}
 if(a.method==="photo"){img=a.img;if(!img){toast("まだ写真がありません");return;}}
 if((a.method==="abc"||a.method==="voice"||a.method==="keep")&&!text){toast("まだ文がありません");return;}
 if(/[\w.+-]+@[\w-]+\.\w+|\d[\d\- ]{8,}\d/.test(text)){toast("この文は使えません。先生に聞いてください");return;}
 if(a.method==="voice"&&text){text=autoEnd(text);a.text=text;}
 var chk=null;if(text&&a.method!=="keep"){chk=a.chk&&a.chk.text===text?a.chk:checkText(st,text,chkTarget(st),a.method);}
 var lv=S.lvSel,was=cleared(st),ok=!!text&&formOk(st,text),model=builtLv(st,lv)||built(st)||sample(st);
 S.tries[st.id]=S.tries[st.id]||{};S.tries[st.id][lv]=text||"（手書き）";
 S.answers[st.id]={text:text,method:a.method,ok:ok,img:img};
 S.saved={chk:chk,text:text,method:a.method,ok:ok,img:img,model:model,newly:!was&&cleared(st),praise:PRAISE[Math.floor(Math.random()*PRAISE.length)]};
 S.hw.full=false;store();render();
 if(chk&&GAS)radarPng([chk.a.tell,chk.a.form,chk.a.words,chk.a.rep],function(png){logEv("save",chk,png);});else logEv("save",chk);
 var sid=st.id,s=sel(st);
 run("saveAnswer",{theme:T().id,step:sid,method:a.method,text:text,model:model,ok:ok,img:img,score:chk?scoreStr(chk.a):"",choice:{lv:lv,x:s.x,slv:s.lv}},function(r){
  if(r&&r.blocked){delete S.tries[sid][lv];delete S.answers[sid];S.saved=null;store();toast("この文は使えません。先生に聞いてください");render();}
  else if(r&&r.fileId&&S.answers[sid])S.answers[sid].fileId=r.fileId;
 });
}
function doNote(){
 var st=cur(),a=S.inp||{},text=inpText(),img="";
 if(a.method==="hand"&&!text)img=hwImage();
 if(a.method==="photo"&&!text)img=a.img||"";
 if(!text&&!img){
  if(S.stage===2&&S.conv){var ls=convLines(st),i=Math.min(S.conv.i,ls.length-1);text=ls[i][0]==="Y"?ls[i][1]:built(st);}
  else text=built(st);
 }
 if(!text&&!img){toast("まだ文がありません");return;}
 if(/[\w.+-]+@[\w-]+\.\w+|\d[\d\- ]{8,}\d/.test(text)){toast("この文は使えません。先生に聞いてください");return;}
 var lab=T().ja+" ／ "+(S.step+1)+" "+st.title,n={time:nowStr(),label:lab,text:text,img:img};
 S.notes.unshift(n);store();toast("★ ノートに残しました");logEv("note",null);
 run("saveNote",{theme:T().id,step:st.id,label:lab,text:text,img:img},function(r){
  if(r&&r.blocked){S.notes.splice(S.notes.indexOf(n),1);toast("この文は使えません。先生に聞いてください");}
  else if(r&&r.url)S.noteUrl=r.url;
 });
}
var ACT={
 home:function(){S.view="home";S.hw.full=false;},
 go:function(d){S.view=d.v;S.hw.full=false;if(d.v==="teacher"&&!S.tlist)ACT.treload();
  if(d.v==="notes"&&GAS){S.notesLoaded=false;run("getNotes",null,function(r){S.notesLoaded=true;if(r){S.notes=r.notes||[];if(r.url)S.noteUrl=r.url;}render();});}},
 theme:function(d){S.th=+d.v;S.view="route";},
 level:function(d){S.level=+d.v;store();},
 uimode:function(){S.ui={ja:"ruby",ruby:"en",en:"ja"}[S.ui]||"ja";store();},
 scale:function(d){S.scale=+d.v;store();},
 kbl:function(d){S.kbl=d.v==="qwerty"?"qwerty":"abc";store();},
 color:function(){var i=PAL_ORDER.indexOf(S.theme);S.theme=PAL_ORDER[(i+1)%PAL_ORDER.length];store();},
 rate:function(d){S.rate=+d.v;store();speak("Hello.");},
 open:function(d){if(d.t!==undefined)S.th=+d.t;enterStep(+d.v);},
 say:function(d){if(d.t)speak(d.t,null,d.w);return false;},
 tiers:function(){speakSeq(cur().lv.map(function(l){return {t:blank(l[0]),w:"Y",gap:900};}));return false;},
 all:function(d){
  if(d.v==="speech")speakSeq(speechLines(T()).filter(function(x){return x[1];}).map(function(x){return {t:x[1],w:"Y",gap:600};}));
  else speakSeq(modelLines(cur()).map(function(m){return {t:m[1],w:m[0],gap:500};}));return false;},
 stage:function(d){setStage(+d.v);},
 lv:function(d){var st=cur(),s=sel(st);S.sel[st.id]={lv:+d.v,x:s.x};store();speak(built(st)||blank(st.lv[+d.v][0]),null,"Y");},
 pick:function(d){var st=cur(),s=sel(st);S.sel[st.id]={lv:s.lv,x:+d.v};store();speak(built(st),null,"Y");},
 swap:function(d){S.swap=d.v==="1";S.conv=null;S.inp=freshInp("conv");resetHW();},
 conv:function(){S.conv={i:0,mine:{},img:{},praise:PRAISE[Math.floor(Math.random()*PRAISE.length)]};S.inp=freshInp("conv");convNext();return false;},
 said:function(d){var c=S.conv;if(!c)return false;
  if(d.v==="use"){var t=inpText();if(t&&S.inp.method==="voice")t=autoEnd(t);var im=S.inp.method==="hand"&&!t?hwImage():"";if(!t&&!im){toast("まだ入れていません");return false;}c.mine[c.i]=t||"（手書き）";if(im)c.img[c.i]=im;if(t)speak(t,null,"Y");}
  c.i++;S.inp=freshInp("conv");resetHW();
  setTimeout(convNext,d.v==="use"?1200:0);if(d.v==="use")render();return false;},
 imethod:function(d){var a=S.inp;a.chk=null;
  if(a.method===d.v&&a.ctx!=="ans"){a.method="";resetHW();return;}
  a.method=d.v;delete a.read;a.kbOpen=false;a.img="";resetHW();
  if(d.v==="keep")a.text=builtLv(cur(),S.lvSel);
  else if(d.v==="hand"||d.v==="photo")a.text="";
  else if(a.ctx!=="ans")a.text="";},
 lvsel:function(d){S.lvSel=+d.v;S.inp=ansInp(S.lvSel);resetHW();var t=builtLv(cur(),S.lvSel);if(t)speak(t,null,"Y");},
 key:function(d){S.inp.text+=d.v;if(S.inp.caps)S.inp.caps=false;},
 caps:function(){S.inp.caps=!S.inp.caps;},
 bs:function(){S.inp.text=S.inp.text.slice(0,-1);},
 clr:function(){S.inp.text="";},
 kbopen:function(){S.inp.kbOpen=true;},
 sayta:function(){var ta=$("ta");if(ta)speak(ta.value,null,"Y");return false;},
 hwfull:function(){S.hw.full=!S.hw.full;},
 hwthick:function(){S.hw.thick=!S.hw.thick;},
 hwundo:function(){S.hw.strokes.pop();},
 hwclr:function(){S.hw.strokes=[];},
 read:function(){
  var a=S.inp,img=a.method==="hand"?hwImage():a.img;if(!img){toast("まだ書いていません");return false;}
  toast("読み取っています…");
  run("readImage",{img:img},function(r){a.read=(r&&r.text)||"";a.text=a.read;a.kbOpen=!a.read;S.hw.full=false;if(!a.read)toast("読み取れませんでした。ABCキーボードで入れられます");render();});
  return false;
 },
 save:function(){doSave();return false;},
 check:function(){var st=cur(),a=S.inp,t=inpText();
  if(!t){toast(a.method==="hand"||a.method==="photo"?(GAS?"「読み取る」を押してから点検します":"ABCキーボードで文を入れてから点検します"):"まだ文がありません");return false;}
  var res=checkText(st,t,chkTarget(st),a.method);if(res.auto)a.text=res.text;a.chk=res;logEv("check",res);},
 note:function(){doNote();return false;},
 redo:function(){S.saved=null;S.inp=ansInp(S.lvSel);resetHW();},
 more:function(){var st=cur(),n=nextUntried(st,S.lvSel);if(n>=0)S.lvSel=n;S.saved=null;S.inp=ansInp(S.lvSel);resetHW();},
 submit:function(){
  var Tm=T(),t=speechLines(Tm).map(function(x){return x[1];}).filter(function(x){return x;}).join(" ");S.answers[endId(Tm)]={text:t,method:"keep",ok:true};store();
  run("saveAnswer",{theme:Tm.id,step:endId(Tm),method:"keep",text:t,model:"",ok:true,img:"",choice:{}});speak("You did it!");
 },
 dl:function(d){if(S.dqOn){S.dq+=d.v;}else{S.dl=d.v;S.dq=d.v;S.dqOn=true;}S.dsel=null;},
 dqbs:function(){S.dq=S.dq.slice(0,-1);if(!S.dq)S.dqOn=false;},
 dqclr:function(){S.dq="";S.dqOn=false;},
 dw:function(d){S.dsel=+d.v;var x=dictAll().filter(function(e){return e.id===S.dsel;})[0];if(x)speak(x.w.replace(/\(.*?\)/g,""));},
 dsrc:function(d){S.dsrc=d.v;S.dsel=null;store();},
 dlv:function(d){S.dlv=d.v;S.dsel=null;},
 words:function(d){var one=/^[A-Za-z']+$/.test(d.t);S.words={t:d.t,sel:one?d.t:""};if(one)speak(d.t);renderOv();return false;},
 wsel:function(d){S.words.sel=d.v;speak(d.v);renderOv();return false;},
 wclose:function(){S.words=null;renderOv();return false;},
 img:function(d){toast("読み込み中…");run("getImage",d.v,function(r){if(r){S.imgs[d.v]=r;render();}});return false;},
 build:function(){toast("集計しています…");run("buildNow",null,function(r){toast(r&&r.ok?"集計しました（"+r.students+"人・期間 "+r.period+"・記録を書いた日 "+r.docs+"）":"集計できませんでした");});return false;},
 treload:function(){S.tlist=null;run("teacherList",null,function(r){S.tlist=r||[];render();});},
 reg:function(){
  var n=$("rn").value.trim(),c=$("rc").value.trim();if(!n){toast("ニックネームを入れてください");return false;}
  run("register",{nick:n,cls:c},function(r){if(r&&r.ok){S.nick=n;S.cls=c;render();}else toast((r&&r.msg)||"登録できませんでした");});return false;
 }
};
document.addEventListener("click",function(e){
 var el=e.target.closest?e.target.closest("[data-a]"):null;if(!el||el.disabled)return;
 var f=ACT[el.dataset.a];if(!f)return;
 if(S.inp&&$("ta"))S.inp.text=$("ta").value;
 var sc=saveScroll(),v0=S.view+S.step+S.stage+S.th;
 if(f(el.dataset)!==false){render();if(v0===S.view+S.step+S.stage+S.th)restoreScroll(sc);}
});
function saveScroll(){return [].map.call(document.querySelectorAll(".pane,.main"),function(p){return p.scrollTop;});}
function restoreScroll(sc){[].forEach.call(document.querySelectorAll(".pane,.main"),function(p,i){if(sc[i])p.scrollTop=sc[i];});}
window.addEventListener("resize",function(){if($("cv"))mountHW();});
/* iPad：キーボード（音声入力を含む）が下から出てきたら、入力欄が隠れないように、
   入力欄を画面の上のほうへ自動で上げる。生徒が自分でスクロールしなくてよいように。（v0.13） */
function isField(el){return el&&/^(TEXTAREA|INPUT)$/.test(el.tagName)&&el.type!=="file";}
function showFocus(){
 var el=document.activeElement;if(!isField(el))return;
 var p=el.closest(".pane,.main,.modal .card");if(!p)return;
 var r=el.getBoundingClientRect(),pr=p.getBoundingClientRect(),want=pr.top+Math.min(80,pr.height*0.12);
 if(Math.abs(r.top-want)>8)p.scrollTop+=r.top-want;
}
var kbdT=null;
document.addEventListener("focusin",function(e){if(!isField(e.target))return;clearTimeout(kbdT);document.documentElement.classList.add("kbd");
 [50,350,800].forEach(function(t){setTimeout(showFocus,t);});});
document.addEventListener("focusout",function(e){if(!isField(e.target))return;kbdT=setTimeout(function(){if(!isField(document.activeElement))document.documentElement.classList.remove("kbd");},400);});
window.addEventListener("resize",function(){setTimeout(showFocus,60);});
if(window.visualViewport)window.visualViewport.addEventListener("resize",function(){setTimeout(showFocus,60);});
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}

/* ---------- 始まり ---------- */
load();render();
if(GAS){
 run("boot",null,function(r){
  S.ready=true;
  if(r){S.nick=r.nick;S.cls=r.cls;S.teacher=r.teacher;S.answers=r.answers||{};S.tries=r.tries||{};S.noteUrl=r.noteUrl||"";
   if(r.sel)Object.keys(r.sel).forEach(function(k){S.sel[k]=r.sel[k];});}
  render();
  run("getDict",null,function(t){try{S.dict=JSON.parse(t);render();}catch(e){}});
 });
}
window.__WP={S:S,render:render};
})();
