:root{--bg:#0b0c0f;--panel:#16181d;--panel2:#1f2229;--line:#3a3f4a;--tx:#f5f5f2;--dim:#b9bdc6;
--go:#ffd23f;--kai:#5fd4ff;--you:#9df28a;--new:#ff9f6b;--rev:#8fb8ff;--onbg:#3a3210;--sentbg:#10210e;--inbg:#000;--ongo:#111;--glow:#ffd23f55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}html.s1{font-size:21px}html.s2{font-size:25px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
.en{font-family:Andika,"BIZ UDPGothic",sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.4rem .6rem;background:var(--panel);border-bottom:2px solid var(--line)}
.bar .ttl{font-weight:700;margin-right:auto;min-width:0}
.bar .ttl small{color:var(--dim);font-weight:400;display:block;font-size:.75rem;line-height:1.2}
.bar .ttl{line-height:1.25}
.cnt{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.25rem;margin:.4rem 0}.cnt .b{min-width:0;padding:0;font-weight:700}
.hl{color:var(--go)}
.xrow{display:flex;gap:.4rem;align-items:center;min-width:0}.xrow>.say{flex:1;min-width:0}.xrow>.b,.xrow>.lab{flex:none}
.tile.chip{display:inline-flex;flex-direction:column;margin:.15rem}
.tile.chip:not(.on){opacity:.75;border-style:dashed}
.en ruby rt{font-family:inherit;letter-spacing:0}

ve a copy of the worksheet?","プリントのコピーを1枚もらえますか？",""],[524,"copy","A2","動","写す、コピーする","Copy the words from the board into your notebook.","黒板の単語をノートに写してください。",""],[525,"corn","A1","名","とうもろこし","I love corn soup in winter.","冬はコーンスープが大好きです。",""],[526,"corner","A1","名","角、すみ","Turn left at the next corner.","次の角を左に曲がってください。",""],[527,"correct","A1","形","正しい","Your answer is correct. Good job!","あなたの答えは正しいです。よくできました！",""],[528,"correctly","A2","副","正しく","Did I say your name correctly?","あなたの名前、正しく言えましたか？",""],[529,"cost","A2","名","費用、値段","The cost of the trip is ten thousand yen.","旅行の費用は1万円です。",""],[530,"cost","A2","動","（お金が）かかる","How much does this bag cost?","このかばんはいくらですか？",""],[531,"couch","A1","名","ソファー、長いす","My cat is sleeping on the couch.","うちのねこがソファーで寝ています。",""],[532,"could","A1","助動","〜できた、〜してもらえますか","Could you open the door for me?","ドアを開けてもらえますか？",""],[533,"count","A2","動","数える","Let's count to ten in English.","英語で10まで数えよう。",""],[534,"country","A2","名","国、田舎","Which country do you want to visit?","どの国に行ってみたいですか？",""],[535,"countryside","A2","名","田舎、田園地帯","My grandparents live in the countryside.","祖父母は田舎に住んでいます。",""],[536,"couple","A2","名","（a couple of で）2つ、2、3","I'll be ready in a couple of minutes.","2、3分で準備できるよ。",""],[537,"course","A1","名","講座、コース","I'm taking a cooking course this summer.","この夏、料理の講座を受けています。",""],[538,"court","A2","名","（テニスなどの）コート","Let's meet at the tennis court at three.","3時にテニスコートで会おう。",""],[539,"cousin","A1","名","いとこ","My cousin and I play games online together.","いとこと私はオンラインで一緒にゲームをします。",""],[540,"cover","A1","名","表紙、カバー、ふた","I like the cover of this book.","この本の表紙が好きです。",""],[541,"cover","A2","動","おおう、かぶせる","Cover your mouth when you cough.","せきをするときは口をおおってください。",""],[542,"cow","A1","名","牛、雌牛","We saw lots of cows at the farm.","牧場でたくさんの牛を見ました。",""],[543,"crazy","A2","形","夢中な、とんでもない","My brother is crazy about soccer.","兄はサッカーに夢中です。",""],[544,"cream","A2","形","クリーム色の","I want a cream sweater for winter.","冬用にクリーム色のセーターがほしいです。",  var good=[];
 if(learned.length)good.push("アプリで学んだ日："+learned.length+"日");
 var f4=all.filter(function(a){return a[1]>=4;}).length;if(f4)good.push("「3つの言い方」の形を使えた文："+f4);
 if(own)good.push("自分の言葉で作った文："+own);
 var vary=keys.filter(function(k){return Object.keys(steps[k].lv).length>=2;}).length;if(vary)good.push("いくつかの言い方を使えた場面："+vary);
 if(convs)good.push("Kai とのやり取りを最後までした回数："+convs);
 if(notes)good.push("ノートに残した文："+notes);
 var grew=keys.filter(function(k){var a=steps[k].a;if(a.length<2)return false;var s=function(x){return x[0]+x[1]+x[2];};return s(a[a.length-1])>s(a[0]);}).length;
 if(grew)good.push("練習して前より良くなった場面："+grew);
 return {learned:learned,last:last?[last[0],last[1],last[2],rep]:null,first:first&&all.length>5?[first[0],first[1],first[2],rep]:null,good:good,steps:keys.length};
}
function calHtml(learned){
 var set={};learned.forEach(function(d){set[d]=1;});
 var now=new Date(),out="";
 for(var m=1;m>=0;m--){
  var y=now.getFullYear(),mo=now.getMonth()-m;if(mo<0){mo+=12;y--;}
  var first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),cells="";
  "日月火水木金土".split("").forEach(function(w){cells+='<div class="cw">'+w+'</div>';});
  for(var i=0;i<first.getDay();i++)cells+='<div></div>';
  for(var d=1;d<=dim;d++){var k=y+"-"+("0"+(mo+1)).slice(-2)+"-"+("0"+d).slice(-2);cells+='<div class="cd'+(set[k]?" on":"")+'">'+(set[k]?"★":"")+'<span>'+d+'</span></div>';}
  out+='<div class="cal"><b>'+y+'年'+(mo+1)+'月</b><div class="cg">'+cells+'</div></div>';
 }
 return '<div class="cals">'+out+'</div>';
}

function freshInp(ctx){return {ctx:ctx,method:"",text:"",img:"",caps:false};}
function ansInp(lv){var st=cur();return lv===3?{ctx:"ans",method:"abc",text:"",img:"",caps:false}:{ctx:"ans",method:"keep",text:builtLv(st,lv),img:"",caps:false};}
function resetHW(){S.hw.strokes=[];S.hw.full=false;}
function enterStep(i){S.step=i;S.stage=0;S.conv=null;S.swap=false;S.saved=null;S.inp=null;S.view="step";resetHW();}
function setStage(n){
 var st=cur();S.stage=n;S.conv=null;S.saved=null;resetHW();
 if(n===1)S.inp=freshInp("make");
 if(n===2)S.inp=freshInp("conv");
 if(n===3){var s=sel(st),t=S.tries[st.id]||{};S.lvSel=t[s.lv]===undefined?s.lv:Math.max(0,nextUntried(st,s.lv));if(nextUntried(st,s.lv)<0)S.lvSel=s.lv;S.inp=ansInp(S.lvSel);}
}
function convNext(){
 var lines=convLines(cur()),c=S.conv;if(!c)return;
 render();
 if(c.i>=lines.length){if(!c.logged){c.logged=true;logEv("conv",null);}return;}
 if(lines[c.i][0]==="K"){var tok=c;speak(lines[c.i][1],function(){if(S.conv!==tok)return;c.i++;setTimeout(convNext,300);},"K");}
}
function inpText(){var a=S.inp,ta=$("ta");if(ta&&a)a.text=ta.value;return a?norm(a.text):"";}
function doSave(){
 var st=cur(),a=S.inp,text=inpText(),img="";
 if(a.method==="hand"){img=hwImage();if(!img){toast("まだ書いていません");return;}if(a.read===undefined)text="";}
 if(a.method==="photo"){img=a.img;if(!img){toast("まだ写真がありません");return;}}
 if((a.method==="abc"||a.method==="voice"||a.method==="keep")&&!text){toast("まだ文がありません");return;}
 if(/[\w.+-]+@[\w-]+\.\w+|\d[\d\- ]{8,}\d/.test(text)){toast("この文は使えません。先生に聞いてください");return;}
 if(a.method==="voice"&&text){text=autoEnd(text);a.text=text;}
 var chk=null;if(text&&a.method!=="keep"){chk=a.chk&&a.chk.text===text?a.chk:checkText(st,text,chkTarget(st),a.method);}
 var lv=S.lvSel,was=cleared(st),ok=!!text&&formOk(st,text),model=builtLv(st,lv)||built(st)||sample(st);
 S.tries[st.id]=S.tries[st.id]||{};S.tries[st.id][lv]=text||"（手書き）";
 S.answers[st.id]={text:text,method:a.method,ok:ok,img:img};
 S.saved={chk:chk,text:text,method:a.method,ok:ok,img:img,model:model,newly:!was&&cleared(st),praise:PRAISE[Math.floor(Math.random()*PRAISE.length)]};
 S.hw.full=false;store();render();
 if(chk&&GAS)radarPng([chk.a.tell,chk.a.form,chk.a.words,chk.a.rep],function(png){logEv("save",chk,png);});else logEv("save",chk);
 var sid=st.id,s=sel(st);
 run("saveAnswer",{theme:T().id,step:sid,method:a.method,text:text,model:model,ok:ok,img:img,score:chk?scoreStr(chk.a):"",choice:{lv:lv,x:s.x,slv:s.lv}},function(r){
  if(r&&r.blocked){delete S.tries[sid][lv];delete S.answers[sid];S.saved=null;store();toast("この文は使えません。先生に聞いてください");render();}
  else if(r&&r.fileId&&S.answers[sid])S.answers[sid].fileId=r.fileId;
 });
}
function doNote(){
 var st=cur(),a=S.inp||{},text=inpText(),img="";
 if(a.method==="hand"&&!text)img=hwImage();
 if(a.method==="photo"&&!text)img=a.img||"";
 if(!text&&!img){
  if(S.stage===2&&S.conv){var ls=convLines(st),i=Math.min(S.conv.i,ls.length-1);text=ls[i][0]==="Y"?ls[i][1]:built(st);}
  else text=built(st);
 }
 if(!text&&!img){toast("まだ文がありません");return;}
 if(/[\w.+-]+@[\w-]+\.\w+|\d[\d\- ]{8,}\d/.test(text)){toast("この文は使えません。先生に聞いてください");return;}
 var lab=T().ja+" ／ "+(S.step+1)+" "+st.title,n={time:nowStr(),label:lab,text:text,img:img};
 S.notes.unshift(n);store();toast("★ ノートに残しました");logEv("note",null);
 run("saveNote",{theme:T().id,step:st.id,label:lab,text:text,img:img},function(r){
  if(r&&r.blocked){S.notes.splice(S.notes.indexOf(n),1);toast("この文は使えません。先生に聞いてください");}
  else if(r&&r.url)S.noteUrl=r.url;
 });
}

/* iPad：キーボード（音声入力を含む）が下から出てきたら、入力欄が隠れないように、

function isField(el){return el&&/^(TEXTAREA|INPUT)$/.test(el.tagName)&&el.type!=="file";}
function showFocus(){
 var el=document.activeElement;if(!isField(el))return;
 var p=el.closest(".pane,.main,.modal .card");if(!p)return;
 var r=el.getBoundingClientRect(),pr=p.getBoundingClientRect(),want=pr.top+Math.min(80,pr.height*0.12);
 if(Math.abs(r.top-want)>8)p.scrollTop+=r.top-want;
}

document.addEventListener("focusout",function(e){if(!isField(e.target))return;kbdT=setTimeout(function(){if(!isField(document.activeElement))document.documentElement.classList.remove("kbd");},400);});
